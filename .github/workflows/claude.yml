# ─────────────────────────────────────────────────────────────────────────────
# Your auto-coder. Mention @claude in any GitHub issue or pull-request comment
# (e.g. "@claude add a dark/light toggle") and Claude will code the change and
# open/update a PR for you.
#
# ONE-TIME SETUP (required before this works):
#   1. Get an Anthropic API key: https://console.anthropic.com/settings/keys
#   2. In this repo on GitHub: Settings → Secrets and variables → Actions →
#      New repository secret →  Name: ANTHROPIC_API_KEY   Value: your sk-ant-... key
#   3. Install the Claude GitHub app if prompted: https://github.com/apps/claude
#
# Until the secret is added, this workflow simply does nothing — it's safe to merge.
# ─────────────────────────────────────────────────────────────────────────────
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
